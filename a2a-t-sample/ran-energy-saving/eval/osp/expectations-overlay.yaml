# osp-expectations-overlay/v1
#
# Hand-authored expectation blocks layered onto eval/osp/cases at load time (CaseCatalog).
# Keep this file instead of editing the generated case YAML:
#   * the yellow zone hot-replaces eval/osp/cases, so a merge into those files is lost;
#   * the generated files stay the single source for validate / task_t / rounds / final_state;
#   * this one file can be committed and reviewed without touching 100 generated files.
#
# Only two keys are accepted, both produced by the annotation console:
#   a2a-t.slot_errors            only on a case whose a2a-t.validate is blocked
#   <protocol>.negotiation.messages
#
# Shape:
#
# cases:
#   - id: 16
#     a2a-t:
#       slot_errors:
#         mode: any
#         expect:
#           - code: slot.constraint_violated
#             slotName: 增益目标
#             facts: {actual: "20%"}
#   - id: 26
#     a2a-t:
#       negotiation:
#         messages:
#           - - |-
#               ## Feasibility Negotiation
#               ...
#     a2a:
#       negotiation:
#         messages:
#           - - |-
#               OK, lower the target to 2Mbps.
#
schema: osp-expectations-overlay/v1
cases: []
